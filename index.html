<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>দত্তবাড়ীর পুজো পার্বণ - ঐতিহ্যবাহী স্মারক গ্রন্থ</title>
  
  <!-- Google Fonts for Elegant Bengali Typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anek+Bangla:wght@400;600;700&family=Atma:wght@500;700&display=swap" rel="stylesheet">
  
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <!-- StPageFlip Library CDN with fallback detection -->
  <script src="https://cdn.jsdelivr.net/npm/page-flip@0.7.8/dist/js/page-flip.browser.js"></script>

  <style>
    :root {
      --primary-crimson: #7A0C0D;
      --deep-maroon: #3B0003;
      --royal-gold: #D4AF37;
      --light-gold: #F3E5AB;
      --parchment-bg: #FDFBF7;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      background: radial-gradient(circle, var(--primary-crimson) 0%, var(--deep-maroon) 100%);
      color: var(--light-gold);
      font-family: 'Anek Bangla', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      overflow-x: hidden;
    }

    header {
      width: 100%;
      text-align: center;
      padding: 15px 10px;
      background: rgba(0, 0, 0, 0.4);
      border-bottom: 2px solid var(--royal-gold);
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(5px);
    }

    .title-container h1 {
      font-family: 'Atma', cursive;
      font-size: 1.8rem;
      color: var(--royal-gold);
      text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
      letter-spacing: 1px;
    }

    .title-container p {
      font-size: 0.95rem;
      color: #fff;
      margin-top: 2px;
      opacity: 0.9;
    }

    .credits-bar {
      display: flex;
      justify-content: center;
      gap: 12px;
      margin-top: 8px;
      font-size: 0.85rem;
      flex-wrap: wrap;
    }

    .credit-tag {
      background: rgba(212, 175, 55, 0.15);
      border: 1px solid var(--royal-gold);
      padding: 3px 12px;
      border-radius: 15px;
      color: #fff;
    }

    .credit-tag span {
      color: var(--royal-gold);
      font-weight: 600;
    }

    .stage {
      flex-grow: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      padding: 20px 10px;
      position: relative;
    }

    .flipbook-wrapper {
      position: relative;
      box-shadow: 0 20px 40px rgba(0,0,0,0.8);
      border-radius: 4px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .page {
      background-color: var(--parchment-bg);
      background-size: contain;
      background-position: center;
      background-repeat: no-repeat;
      border: 1px solid rgba(0,0,0,0.1);
      overflow: hidden;
    }

    .page img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }

    .controls {
      width: 100%;
      background: rgba(0, 0, 0, 0.5);
      border-top: 1px solid var(--royal-gold);
      padding: 12px 20px;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 15px;
      backdrop-filter: blur(5px);
      box-shadow: 0 -4px 15px rgba(0,0,0,0.3);
    }

    .btn {
      background: linear-gradient(135deg, var(--royal-gold) 0%, #AA7C11 100%);
      color: #1a0003;
      border: none;
      padding: 8px 18px;
      font-size: 0.95rem;
      font-family: 'Anek Bangla', sans-serif;
      font-weight: 700;
      border-radius: 25px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.4);
      transition: all 0.2s ease;
    }

    .btn:hover {
      transform: translateY(-2px);
      background: linear-gradient(135deg, #FFF 0%, var(--royal-gold) 100%);
      box-shadow: 0 6px 12px rgba(212, 175, 55, 0.4);
    }

    .btn:active {
      transform: translateY(0);
    }

    .page-indicator {
      font-size: 1rem;
      font-weight: 600;
      color: var(--royal-gold);
      background: rgba(0, 0, 0, 0.6);
      padding: 5px 15px;
      border-radius: 20px;
      border: 1px solid rgba(212, 175, 55, 0.3);
      min-width: 90px;
      text-align: center;
    }

    @media (max-width: 768px) {
      .title-container h1 {
        font-size: 1.4rem;
      }
      .title-container p {
        font-size: 0.85rem;
      }
      .btn {
        padding: 8px 12px;
        font-size: 0.85rem;
      }
      .btn span {
        display: none;
      }
    }
  </style>
</head>
<body>

  <header>
    <div class="title-container">
      <h1>ঐতিহ্যের শতবর্ষ: দত্তবাড়ীর পুজো পার্বণ</h1>
      <p>বিশেষ ডিজিটাল স্মারক সংস্করণ</p>
    </div>
    
    <div class="credits-bar">
      <div class="credit-tag">সংগ্রাহক ও সংকলন: <span>বিবেক দত্ত (স্বর্গ)</span></div>
      <div class="credit-tag"><i class="fa-solid fa-code"></i> ওয়েব রূপান্তরে: <span>সুকান্ত</span></div>
    </div>
  </header>

  <main class="stage">
    <div class="flipbook-wrapper">
      <div id="flipbook">
        <!-- JS dynamically populates images Page1.jpg to Page56.jpg -->
      </div>
    </div>
  </main>

  <footer class="controls">
    <button class="btn" id="btnPrev">
      <i class="fa-solid fa-chevron-left"></i>
      <span>আগের পাতা</span>
    </button>

    <div class="page-indicator">
      <span id="currentPage">১</span> / <span id="totalPages">৫৬</span>
    </div>

    <button class="btn" id="btnNext">
      <span>পরের পাতা</span>
      <i class="fa-solid fa-chevron-right"></i>
    </button>

    <button class="btn" id="btnFullscreen" title="পূর্ণ পর্দা">
      <i class="fa-solid fa-expand"></i>
    </button>
  </footer>

  <script>
    (function() {
      const totalPagesCount = 56;
      const filePrefix = 'Puja';
      const fileExtension = '.jpg';
      
      const flipbookContainer = document.getElementById('flipbook');
      const currentPageEl = document.getElementById('currentPage');

      // Bengali Numeral Helper
      function toBengaliNumerals(num) {
        const bnNums = ['০', '১', '২', '৩', '৪', '৫', '৬', '৭', '৮', '৯'];
        return num.toString().split('').map(d => bnNums[d] || d).join('');
      }

      for (let i = 1; i <= totalPagesCount; i++) {
        const pageDiv = document.createElement('div');
        pageDiv.className = 'page';
        
        const img = document.createElement('img');
        img.src = `${filePrefix}${i}${fileExtension}`;
        img.alt = `পাতা ${i}`;
        img.onerror = function() {
          // Fallback if image path case differs
          if (this.src.includes('Page')) {
            this.src = `page${i}${fileExtension}`;
          }
        };

        pageDiv.appendChild(img);
        flipbookContainer.appendChild(pageDiv);
      }

      function initFlipBook() {
        // Resolve PageFlip constructor class from global scope safely
        const PageFlipClass = (window.St && window.St.PageFlip) || window.PageFlip || window.StPageFlip;

        if (!PageFlipClass) {
          // If script tag hasn't loaded yet, retry shortly
          setTimeout(initFlipBook, 100);
          return;
        }

        // Calculate dynamic dimensions
        let bookWidth = Math.min(window.innerWidth * 0.42, 480);
        let bookHeight = bookWidth * 1.41;

        if (window.innerWidth < 768) {
          bookWidth = Math.min(window.innerWidth * 0.88, 380);
          bookHeight = bookWidth * 1.41;
        }

        try {
          const pageFlip = new PageFlipClass(
            flipbookContainer,
            {
              width: bookWidth,
              height: bookHeight,
              size: "fixed",
              minWidth: 260,
              maxWidth: 600,
              minHeight: 360,
              maxHeight: 850,
              maxShadowOpacity: 0.6,
              showCover: true,
              mobileScrollSupport: false,
              usePortrait: true
            }
          );

          pageFlip.loadFromHTML(document.querySelectorAll('.page'));

          pageFlip.on('flip', (e) => {
            const current = e.data + 1;
            currentPageEl.textContent = toBengaliNumerals(current);
          });

          document.getElementById('btnPrev').addEventListener('click', () => {
            pageFlip.flipPrev();
          });

          document.getElementById('btnNext').addEventListener('click', () => {
            pageFlip.flipNext();
          });

          document.getElementById('btnFullscreen').addEventListener('click', () => {
            if (!document.fullscreenElement) {
              document.documentElement.requestFullscreen().catch(() => {});
            } else {
              document.exitFullscreen();
            }
          });

          window.addEventListener('resize', () => {
            pageFlip.updateFromHtml(document.querySelectorAll('.page'));
          });

        } catch (err) {
          console.error("Flipbook initialization error:", err);
        }
      }

      // Start initialization after window load
      if (document.readyState === 'complete') {
        initFlipBook();
      } else {
        window.addEventListener('load', initFlipBook);
      }
    })();
  </script>
</body>
</html>
